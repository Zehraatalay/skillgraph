services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    env_file:
      - .env

    environment:
      LLM_PROVIDER: gemini

    volumes:
      - skillgraph_cache:/app/.cache/extractions

    expose:
      - "8000"

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "8080:80"

    depends_on:
      - backend

    restart: unless-stopped

volumes:
  skillgraph_cache: